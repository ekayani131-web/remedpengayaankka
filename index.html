      width: 2.3rem;

      display: inline-flex;

      justify-content: center;
      border-radius: 999px;
      background: var(--forest);
      color: #fff;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .question-card {
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: #fff;

      border: 1px solid #d8dfd8;
      border-radius: .75rem;

      background: #fcfdfb;
    }
    .choice-label:hover { border-color: var(--forest); background: #f1faf5; }
    input[type="radio"]:checked + .choice-label {
      border-color: var(--forest);
      background: #d9f1e5;
      box-shadow: inset 0 0 0 1px var(--forest);
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #c8d4cc;
      border-radius: .75rem;
      padding: .75rem .85rem;
      outline: none;
      color: var(--ink);
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--forest);
      box-shadow: 0 0 0 3px rgba(15,90,71,.14);
    }

    .word-grid {
      border-collapse: separate;
      border-spacing: .32rem;
      margin: 0 auto;
    }
    .word-grid td {
      background: #e8f4ec;
      border-radius: .38rem;
      width: 2rem;
      height: 2rem;
      text-align: center;
      font-weight: 800;
      color: #235745;
      font-family: "DM Sans", sans-serif;
    }

    .result-panel { display: none; }
    .result-panel.visible { display: block; animation: rise .4s ease-out; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }

    .reveal { animation: rise .55s ease-out both; }
    .reveal-delay { animation: rise .55s .12s ease-out both; }

    .status-message[hidden] { display: none; }

    @media (max-width: 640px) {

     <div class="mb-5 flex items-start gap-3">
      <div class="rounded-xl bg-emerald-100 p-3 text-emerald-800">
       <i data-lucide="table-properties" aria-hidden="true"></i>
      </div>
      <div>
       <h2 data-template-id="recap-title" class="canva-text text-2xl font-bold"></h2>
       <p data-template-id="recap-help" class="canva-text mt-1"></p>
      </div>
     </div>
     <div id="recap-loading" class="rounded-2xl bg-stone-50 p-5 text-center text-sm font-semibold text-stone-600">
      Memuat rekap hasil...
     </div>
     <div id="recap-error" class="hidden rounded-2xl bg-rose-50 p-5 text-center text-sm font-semibold text-rose-700"></div>
     <div id="recap-list" class="hidden overflow-x-auto">
      <table class="w-full min-w-[620px] border-collapse text-left">
       <thead class="border-b border-stone-200 text-sm text-stone-500">
        <tr>
         <th class="p-3">Nama</th>
         <th class="p-3">Kelas</th>
         <th class="p-3">Nilai</th>
         <th class="p-3">Benar</th>
         <th class="p-3">Salah</th>
         <th class="p-3">Dikumpulkan</th>
        </tr>
       </thead>
       <tbody id="recap-body"></tbody>
      </table>
     </div>

  <script>
    let backendRecords = [];
    let initialLoadTimer;

    const answerKey = {
      q1: "B", q2: "S", q3: "B", q4: "S", q5: "B",
      q6: "B", q7: "S", q8: "B", q9: "S", q10: "B",
      m11: "C", m12: "D", m13: "E", m14: "B",
      m15: "A", m16: "G", m17: "F", m18: "H",
      w1: "ALGORITMA", w2: "BIAS", w3: "PROTOTIPE",
      w4: "ETIKA", w5: "TPU", w6: "CHATBOT"
    };

    function showStatus(message, type) {
      const status = document.getElementById("form-status");
      status.textContent = message;
      status.className = "status-message text-sm font-semibold " + (type === "error" ? "text-rose-700" : "text-emerald-700");
      status.hidden = false;
    }

    function normalize(value) {
      return (value || "").trim().toUpperCase().replace(/\s+/g, " ");
    }

    function getEssayPoint(text) {
      const answer = text.toLowerCase();
      const decomposition = /dekomposisi|memecah|membagi.*masalah|bagian.*kecil/.test(answer);
      const abstraction = /abstraksi|mengabaikan.*detail|informasi.*penting|fokus.*inti/.test(answer);
      const example = /contoh|sekolah|kelas|tugas|jadwal|kelompok/.test(answer);
      return decomposition && abstraction && example ? 1 : 0;
    }

    function calculateResult() {
      let correct = 0;
      const detail = {};

      for (let i = 1; i <= 10; i++) {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        const value = selected ? selected.value : "";
        detail["q" + i] = value;
        if (value === answerKey["q" + i]) correct++;
      }

      for (let i = 11; i <= 18; i++) {
        const value = document.getElementById("m" + i).value;
        detail["m" + i] = value;
        if (value === answerKey["m" + i]) correct++;
      }

      for (let i = 1; i <= 6; i++) {
        const value = document.getElementById("w" + i).value;
        detail["w" + i] = value;
        if (normalize(value) === answerKey["w" + i]) correct++;
      }

      const essay = document.getElementById("essay-answer").value.trim();
      detail.essay = essay;
      correct += getEssayPoint(essay);

      return {
        correct,
        incorrect: 25 - correct,
        score: Math.round((correct / 25) * 100),
        detail: JSON.stringify(detail)
      };
    }

    function renderRecap(records) {
      const loading = document.getElementById("recap-loading");
      const list = document.getElementById("recap-list");
      const body = document.getElementById("recap-body");
      loading.classList.add("hidden");
      list.classList.remove("hidden");

      const sorted = [...records].sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));
      const existing = new Map([...body.children].map(row => [row.dataset.recordId, row]));
      const liveIds = new Set();

      sorted.forEach(record => {
        liveIds.add(record.__backendId);
        let row = existing.get(record.__backendId);
        if (!row) {
          row = document.createElement("tr");
          row.dataset.recordId = record.__backendId;
          row.className = "border-b border-stone-100";
          row.innerHTML = "<td class='p-3 font-semibold'></td><td class='p-3'></td><td class='p-3 font-extrabold text-emerald-800'></td><td class='p-3'></td><td class='p-3'></td><td class='p-3 text-sm text-stone-500'></td>";
          body.appendChild(row);
        }
        const cells = row.querySelectorAll("td");
        cells[0].textContent = record.nama || "-";
        cells[1].textContent = record.kelas || "-";
        cells[2].textContent = record.nilai ?? "-";
        cells[3].textContent = record.benar ?? "-";
        cells[4].textContent = record.salah ?? "-";
        cells[5].textContent = record.submitted_at ? new Date(record.submitted_at).toLocaleString("id-ID") : "-";
      });

      existing.forEach((row, id) => {
        if (!liveIds.has(id)) row.remove();
      });

      if (!sorted.length) {
        body.innerHTML = "<tr><td colspan='6' class='p-6 text-center text-stone-500'>Belum ada hasil yang tersimpan.</td></tr>";
      }
    }

    const handler = {
      onDataChanged(data) {
        clearTimeout(initialLoadTimer);
        backendRecords = data;
        renderRecap(data);
      }
    };

    async function initializeDataSdk() {
      clearTimeout(initialLoadTimer);
      document.getElementById("recap-error").classList.add("hidden");
      document.getElementById("recap-loading").classList.remove("hidden");

      initialLoadTimer = setTimeout(() => {
        document.getElementById("recap-loading").classList.add("hidden");
        const error = document.getElementById("recap-error");
        error.textContent = "Rekap belum dapat dimuat. Silakan coba lagi dengan memuat ulang halaman.";
        error.classList.remove("hidden");
      }, 8000);

      const initResult = await window.dataSdk.init(handler);
      if (!initResult.isOk) {
        clearTimeout(initialLoadTimer);
        document.getElementById("recap-loading").classList.add("hidden");
        const error = document.getElementById("recap-error");
        error.textContent = "Canva Sheet tidak dapat dihubungkan. Silakan muat ulang halaman.";
        error.classList.remove("hidden");
      }
    }

    document.getElementById("exam-form").addEventListener("submit", async function(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const submitButton = document.getElementById("submit-button");

      if (!form.checkValidity()) {
        form.reportValidity();
        showStatus("Lengkapi identitas dan semua jawaban sebelum mengirim.", "error");
        return;
      }

      if (backendRecords.length >= 999) {
        showStatus("Batas rekap telah tercapai. Hasil baru tidak dapat disimpan.", "error");
        return;
      }

      const result = calculateResult();
      const record = {
        nama: document.getElementById("student-name").value.trim(),
        kelas: document.getElementById("student-class").value.trim(),
        nilai: result.score,
        benar: result.correct,
        salah: result.incorrect,
        jawaban_detail: result.detail,
        submitted_at: new Date().toISOString()
      };

      submitButton.disabled = true;
      try {
        const saveResult = await window.dataSdk.create(record);
        if (!saveResult.isOk) {
          showStatus("Jawaban tersimpan mungkin belum dapat dikonfirmasi. Silakan muat ulang sebelum mengirim kembali.", "error");
          return;
        }

        document.getElementById("score-value").textContent = result.score;
        document.getElementById("correct-value").textContent = result.correct + " / 25";
        document.getElementById("incorrect-value").textContent = result.incorrect + " / 25";
        document.getElementById("result-panel").classList.add("visible");
        document.getElementById("result-panel").scrollIntoView({ behavior: "smooth", block: "start" });
        showStatus("Jawaban berhasil dikumpulkan dan tersimpan pada rekap Canva Sheet.", "success");
      } finally {
        submitButton.disabled = false;
      }
    });

    document.addEventListener("DOMContentLoaded", function() {
      lucide.createIcons();
      initializeDataSdk();
    });
  </script>
